services:
  # 1. FastAPI Producer API
  api:
    build: .
    container_name: notification_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: uv run fastapi dev main.py --app app --host 0.0.0.0 --port 8000
    develop:
      watch:
        - action: rebuild
          path: pyproject.toml
        - action: rebuild
          path: uv.lock
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
            - .git/

